name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (derleme + testler)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # API entegrasyon testleri her test sınıfı için bu sunucuda tek kullanımlık bir veritabanı oluşturur.
      ZIRVE_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Runner testleri gerçek Node.js süreçleri başlatır (JavaScript/TypeScript koşucusu).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Zirve.Runner/Node/package-lock.json

      - name: Runner Node bağımlılıkları
        run: npm ci
        working-directory: src/Zirve.Runner/Node

      - name: Derle (uyarılar hata sayılır)
        run: dotnet build Zirve.slnx -c Release

      # İçerik doğrulaması da burada koşar: her problemin referans çözümü bütün testleri geçmek zorundadır.
      - name: Testler
        run: dotnet test --project tests/Zirve.Tests/Zirve.Tests.csproj -c Release --no-build

  frontend:
    name: Frontend (lint + tip denetimi + testler + derleme)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Çalıştırma başına yalıtım (Runner:Isolation) yalnızca Linux'ta, root ve belirli yetkilerle çalışır;
  # burada iki düzeyde gerçekten sınanır.
  runner-isolation:
    name: Runner yalıtımı (kapsayıcı)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNNER_API_KEY: ci-runner-key
      POSTGRES_PASSWORD: ci-postgres-password

    steps:
      - uses: actions/checkout@v5

      # Sandbox sınıfının kendisi: Runner kapsayıcısıyla aynı yetkilerle (root, yalnızca beş yetki) bir
      # kapsayıcıda. Testler bu koşullar yoksa atlanır; atlanan test kalırsa adım başarısız sayılır.
      - name: Yalıtım testleri (root, sınırlı yetkiler)
        run: |
          set -o pipefail
          docker run --rm --init \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID --cap-add KILL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --security-opt no-new-privileges \
            -e ZIRVE_ISOLATION_TESTS=1 -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test --project tests/Zirve.Tests/Zirve.Tests.csproj --filter-class "*IsolationTests" | tee isolation.txt
          grep -Eq "skipped: 0|atlandı: 0" isolation.txt || { echo "Yalıtım testleri atlandı; koşullar sağlanmadı."; exit 1; }

      # Gerçek Runner görüntüsü, docker-compose.yml'deki ayarlarla: kullanıcı kodu bu kapsayıcıda çalışır.
      - name: Runner kapsayıcısını kur ve başlat
        run: docker compose -p zirve up -d --build runner

      - name: GEÇİCİ tanı - Node ve .NET veri belleği
        if: always()
        run: |
          docker compose -p zirve exec -T runner sh -c '
            echo "--- node (sınırsız):"; node -e "console.log(require(\"fs\").readFileSync(\"/proc/self/status\",\"utf8\").match(/^(VmSize|VmData|VmRSS|Threads).*$/gm).join(\" | \"))"
            echo "--- node, --max-old-space-size=256:"; node --max-old-space-size=256 -e "console.log(require(\"fs\").readFileSync(\"/proc/self/status\",\"utf8\").match(/^(VmSize|VmData|VmRSS).*$/gm).join(\" | \"))"
            for mb in 512 768 1024 1280 1536 2048 3072 4096; do
              (ulimit -d $((mb*1024)); node --max-old-space-size=256 -e "1" > /dev/null 2>&1 && echo "node ulimit -d ${mb} MB: başladı" || echo "node ulimit -d ${mb} MB: BAŞLAYAMADI")
            done
            echo "--- uname:"; uname -r; nproc
          '

      - name: Uçtan uca yalıtım denemeleri
        run: |
          docker run --rm --network zirve_sandbox \
            -e RUNNER_URL=http://runner:8080 -e RUNNER_KEY="$RUNNER_API_KEY" \
            -v "$PWD/tests/isolation:/e2e:ro" node:24-slim node /e2e/runner-e2e.mjs

      - name: Runner günlükleri
        if: always()
        run: docker compose -p zirve logs runner
