name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (derleme + testler)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # API entegrasyon testleri her test sınıfı için bu sunucuda tek kullanımlık bir veritabanı oluşturur.
      ZIRVE_TEST_DB: Host=localhost;Port=5432;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Runner testleri gerçek Node.js süreçleri başlatır (JavaScript/TypeScript koşucusu).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Zirve.Runner/Node/package-lock.json

      - name: Runner Node bağımlılıkları
        run: npm ci
        working-directory: src/Zirve.Runner/Node

      - name: Derle (uyarılar hata sayılır)
        run: dotnet build Zirve.slnx -c Release

      # İçerik doğrulaması da burada koşar: her problemin referans çözümü bütün testleri geçmek zorundadır.
      - name: Testler
        run: dotnet test --project tests/Zirve.Tests/Zirve.Tests.csproj -c Release --no-build

  frontend:
    name: Frontend (lint + tip denetimi + testler + derleme)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
