title: Sistem Tasarımı Temelleri
description: Kapasite tahmini, ölçekleme, CAP, önbellek, mesaj kuyrukları ve idempotency.
level: intermediate
timeLimitMinutes: 15
questions:
  - q: "Bir servis günde 10 milyon istek alıyor. Ortalama saniyedeki istek sayısı (QPS) yaklaşık kaçtır?"
    options:
      - "~12"
      - "~120"
      - "~1.200"
      - "~12.000"
    answer: 2
    difficulty: easy
    why: |
      Bir günde yaklaşık 86.400 (kabaca 10⁵) saniye vardır. 10.000.000 / 86.400 ≈ 116. Ezberde tutmaya değer kısayol: günde 1 milyon istek ≈ 12 QPS. Zirve yükü için bu ortalamayı birkaç katıyla çarpın.

  - q: "CAP teoremine göre, **ağ bölünmesi** sırasında dağıtık bir veri deposu hangi seçimle karşı karşıyadır?"
    options:
      - "Hız ile maliyet arasında"
      - "Tutarlılık ile erişilebilirlik arasında"
      - "Okuma ile yazma performansı arasında"
      - "Güvenlik ile kullanılabilirlik arasında"
    answer: 2
    difficulty: medium
    why: |
      Düğümler birbirine ulaşamadığında sistem ya güncel olmayabilecek veriyle yanıt vermeye devam eder (erişilebilirlik, AP) ya da tutarsızlık riskine girmemek için isteği reddeder (tutarlılık, CP). Bölünme toleransından vazgeçmek gerçekçi değildir; ağ hataları kaçınılmazdır. Seçim, veri türüne göre yapılır: bakiye için CP, beğeni sayısı için AP.

  - q: "Veritabanına **okuma kopyaları** (read replica) eklemenin başlıca bedeli nedir?"
    options:
      - "Yazma kapasitesi düşer."
      - "Kopyalama gecikmesi nedeniyle kopyadan okunan veri kısa süreliğine bayat olabilir."
      - "Tablolar arasında join yapılamaz."
      - "Transaction'lar devre dışı kalır."
    answer: 2
    difficulty: medium
    why: |
      Kopyalama çoğunlukla eşzamansızdır: yazma birincil düğümde onaylanır, kopyalara sonradan aktarılır. Kullanıcı bir şeyi kaydedip hemen ardından kopyadan okursa eski halini görebilir. Yaygın çözüm, kullanıcının kendi yazdığını kısa bir süre birincil düğümden okumaktır. Okuma kopyaları yazma kapasitesini artırmaz.

  - q: "Cache-aside deseninde veri güncellendiğinde önbellek için en yaygın ve güvenli yaklaşım hangisidir?"
    options:
      - "Önbelleğe hiç dokunmamak"
      - "Veritabanını güncelleyip ilgili önbellek anahtarını silmek ve emniyet için bir TTL tanımlamak"
      - "Önce önbelleği güncelleyip veritabanını hiç güncellememek"
      - "Bütün önbelleği temizlemek"
    answer: 2
    difficulty: medium
    why: |
      Anahtarı silmek, bir sonraki okumanın veriyi veritabanından taze yüklemesini sağlar ve iki eşzamanlı yazmanın önbellekte eski değer bırakma olasılığını, önbelleği doğrudan güncellemeye göre azaltır. TTL, silmenin başarısız olduğu ya da gözden kaçtığı durumlar için emniyet ağıdır.

  - q: "Bir mesaj kuyruğu **en az bir kez teslim** (at-least-once) garantisi veriyorsa tüketici nasıl tasarlanmalıdır?"
    options:
      - "Mesajları işlemeden önce onaylamalıdır."
      - "Idempotent olmalıdır: aynı mesajı birden fazla kez işlemek sonucu değiştirmemelidir."
      - "Yalnızca tek bir örnek olarak çalışmalıdır."
      - "Her mesajı iki kez işlemelidir."
    answer: 2
    difficulty: medium
    why: |
      En az bir kez teslimde mesaj kaybolmaz ama **yinelenebilir**: tüketici işi yapıp onayı gönderemeden çökerse mesaj yeniden teslim edilir. Tüketici idempotent değilse çift ödeme, çift e-posta gibi hatalar oluşur. Çözümler: işlenen mesaj kimliklerini saklamak, benzersizlik kısıtı kullanmak ya da işlemi doğal olarak idempotent yazmak.

  - q: "Dağıtık önbelleklerde `hash(anahtar) % N` yerine **tutarlı hash** kullanılmasının nedeni nedir?"
    options:
      - "Daha hızlı hash hesaplamak"
      - "Sunucu eklendiğinde ya da çıkarıldığında anahtarların yalnızca küçük bir bölümünün yer değiştirmesini sağlamak"
      - "Anahtarları şifrelemek"
      - "Bütün anahtarları tek bir sunucuda toplamak"
    answer: 2
    difficulty: medium
    why: |
      Modüler dağıtımda `N` değiştiğinde neredeyse bütün anahtarlar farklı sunucuya düşer; önbellek bir anda boşalmış gibi olur. Tutarlı hash'te sunucular ve anahtarlar bir halkaya yerleştirilir; bir sunucu değiştiğinde yalnızca komşu aralıktaki anahtarlar (ortalama 1/N) taşınır.

  - q: "Bir URL kısaltma servisinde tıklamaları saymak istiyorsanız yönlendirme için hangi durum kodu daha uygundur?"
    options:
      - "301 Moved Permanently; tarayıcı kalıcı olarak önbelleğe alır."
      - "302 Found; her tıklama sunucudan geçer."
      - "200 OK"
      - "404 Not Found"
    answer: 2
    difficulty: medium
    why: |
      301 yanıtı tarayıcı tarafından kalıcı olarak önbelleğe alınır: sonraki tıklamalar sunucunuza hiç ulaşmaz. Bu yükü azaltır ama tıklama sayamaz ve bağlantının hedefini sonradan değiştiremezsiniz. 302 her tıklamayı sunucuya getirir; analitik ve son kullanma tarihi için gereken budur.

  - q: "İyi bir **parçalama (sharding) anahtarı** hangi özelliklere sahip olmalıdır? (Birden fazla doğru yanıt vardır.)"
    options:
      - "Veriyi ve yükü parçalar arasında dengeli dağıtmalıdır."
      - "Sık kullanılan sorguların tek bir parçada karşılanmasını sağlamalıdır."
      - "Mümkün olduğunca az farklı değere sahip olmalıdır (ör. ülke kodu)."
      - "Zamanla sürekli artan bir değer olmalıdır ki yeni veriler hep son parçaya yazılsın."
    answer: [1, 2]
    difficulty: hard
    why: |
      Anahtar eşit dağıtmalı ve yaygın sorguları tek parçaya yönlendirmelidir. Az sayıda farklı değeri olan anahtarlar (ülke kodu) bazı parçaları sıcak noktaya çevirir. Sürekli artan anahtarla aralık tabanlı parçalama, bütün yazmaları tek bir parçaya yığar.

  - q: "Uygulama sunucularının **durumsuz** (stateless) olması neden yatay ölçeklemeyi kolaylaştırır?"
    options:
      - "Durumsuz sunucular daha az bellek kullanır."
      - "Herhangi bir istek herhangi bir sunucuya gidebilir; sunucular serbestçe eklenip çıkarılabilir."
      - "Durumsuz sunucular veritabanına ihtiyaç duymaz."
      - "Yük dengeleyiciye gerek kalmaz."
    answer: 2
    difficulty: easy
    why: |
      Sunucu, istekler arasında kullanıcıya özel veri tutmuyorsa (oturum bilgisi paylaşılan bir depoda ya da imzalı çerezde duruyorsa) bütün sunucular birbirinin yerine geçebilir. Yük dengeleyici istekleri dilediği gibi dağıtır; bir sunucu çökerse kullanıcı oturumu kaybolmaz.

  - q: "Her biri %99,9 erişilebilir olan ve bir isteğin **sırayla hepsinden** geçmesi gereken üç servisin toplam erişilebilirliği yaklaşık nedir?"
    options:
      - "%99,99"
      - "%99,9"
      - "%99,7"
      - "%97"
    answer: 3
    difficulty: medium
    why: |
      Seri bağlı bileşenlerin erişilebilirliği çarpılır: 0,999 × 0,999 × 0,999 ≈ 0,997. Zincire eklenen her bağımlılık toplam erişilebilirliği düşürür. Bunu iyileştirmenin yolları: yedeklilik (paralel bileşenler), kritik olmayan bağımlılıkları kuyrukla ayırmak ve bağımlılık çöktüğünde kısıtlı da olsa çalışmaya devam edebilmek.
