# Öğrenme yolları ve bölümleri. Sıra, dosyadaki sıradır.
# Dersler:  content/lessons/{yol}/{bölüm}/NN-slug.md
# Testler:  content/quizzes/{yol}/NN-slug.yaml

- slug: mulakat
  title: Mülakat Hazırlığı
  description: Büyük teknoloji şirketlerinde mülakat süreci nasıl işler, nasıl plan yapılır, kodlama ve davranışsal mülakatlarda nelere bakılır.
  icon: compass
  accent: amber
  modules:
    - slug: surec
      title: Süreç ve Plan
      description: Mülakat aşamaları, seviye sistemi ve gerçekçi bir çalışma planı.
    - slug: davranissal
      title: Davranışsal Mülakat
      description: Deneyimlerinizi etkili anlatmak için STAR yöntemi ve özgeçmiş.

- slug: algoritmalar
  title: Algoritmalar ve Veri Yapıları
  description: Kodlama mülakatlarının omurgası. Karmaşıklık analizi, temel veri yapıları ve problem çözme kalıpları.
  icon: binary
  accent: emerald
  modules:
    - slug: temeller
      title: Temeller
      description: Karmaşıklık analizi, diziler ve hash tabloları.
    - slug: kaliplar
      title: Problem Çözme Kalıpları
      description: İki işaretçi, kayan pencere, ikili arama, yığın.
    - slug: veri-yapilari
      title: Veri Yapıları
      description: Bağlı listeler, ağaçlar, heap ve graflar.
    - slug: ileri
      title: İleri Teknikler
      description: Dinamik programlama ve geri izleme.

- slug: sistem-tasarimi
  title: Sistem Tasarımı
  description: Ölçeklenebilir sistemleri tasarlamak ve bunu 45 dakikada anlatabilmek. Yapı taşları, ödünleşimler ve örnek tasarımlar.
  icon: network
  accent: sky
  modules:
    - slug: temeller
      title: Temeller
      description: Mülakat çerçevesi, ölçekleme ve veri katmanı.
    - slug: yapi-taslari
      title: Yapı Taşları
      description: Önbellek, mesaj kuyrukları ve tutarlılık.
    - slug: ornek-tasarimlar
      title: Örnek Tasarımlar
      description: Uçtan uca çözülmüş klasik sorular.

- slug: csharp
  title: C#
  description: Tip sistemi, bellek yönetimi, LINQ, async/await ve eşzamanlılık. Dilin mülakatlarda sorulan derin konuları.
  icon: csharp
  accent: violet
  modules:
    - slug: temeller
      title: Tip Sistemi ve Bellek
      description: Değer ve referans tipleri, GC ve nesne ömrü.
    - slug: dil-ozellikleri
      title: Dil Özellikleri
      description: Generics, delegeler, LINQ ve async/await.
    - slug: ileri
      title: İleri Konular
      description: Eşzamanlılık ve modern C#.

- slug: dotnet
  title: .NET ve ASP.NET Core
  description: İstek hattı, dependency injection, Web API tasarımı, EF Core ve üretime hazır servis yazmanın esasları.
  icon: server
  accent: indigo
  modules:
    - slug: aspnet-core
      title: ASP.NET Core
      description: Middleware, DI ve API tasarımı.
    - slug: veri-ve-uretim
      title: Veri Erişimi ve Üretim
      description: EF Core, performans ve dayanıklılık.

- slug: kutuphane-api
  title: "Pratik Projesi: Kütüphane Yönetim API'si"
  description: Sıfırdan, faz faz kendi yazacağın bir .NET 10 Minimal API. Clean Architecture, iş kuralları, testler ve her fazın sonunda kod review'ı.
  icon: hammer
  accent: orange
  modules:
    - slug: hazirlik
      title: Hazırlık
      description: Rehberin kullanımı, geliştirme ortamı, proje tanımı, mimari ve paketler.
    - slug: fazlar
      title: Fazlar
      description: Çözüm iskeletinden entegrasyon testlerine ve bonus görevlere, adım adım uygulama.
    - slug: basvuru
      title: Başvuru
      description: Clean Code kontrol listesi, review süreci, sözlük ve kaynaklar.

- slug: javascript
  title: JavaScript
  description: Dilin gerçekte nasıl çalıştığı. Tipler, closure, prototipler, event loop ve asenkron programlama.
  icon: javascript
  accent: yellow
  modules:
    - slug: temeller
      title: Dilin Çekirdeği
