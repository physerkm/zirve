# Öğrenme yolları ve bölümleri. Sıra, dosyadaki sıradır.
# Dersler:  content/lessons/{yol}/{bölüm}/NN-slug.md
# Testler:  content/quizzes/{yol}/NN-slug.yaml

- slug: mulakat
  title: Mülakat Hazırlığı
  description: Büyük teknoloji şirketlerinde mülakat süreci nasıl işler, nasıl plan yapılır, kodlama ve davranışsal mülakatlarda nelere bakılır.
  icon: compass
  accent: amber
  modules:
    - slug: surec
      title: Süreç ve Plan
      description: Mülakat aşamaları, seviye sistemi ve gerçekçi bir çalışma planı.
    - slug: davranissal
      title: Davranışsal Mülakat
      description: Deneyimlerinizi etkili anlatmak için STAR yöntemi ve özgeçmiş.

- slug: algoritmalar
  title: Algoritmalar ve Veri Yapıları
  description: Kodlama mülakatlarının omurgası. Karmaşıklık analizi, temel veri yapıları ve problem çözme kalıpları.
  icon: binary
  accent: emerald
  modules:
    - slug: temeller
      title: Temeller
      description: Karmaşıklık analizi, diziler ve hash tabloları.
    - slug: kaliplar
      title: Problem Çözme Kalıpları
      description: İki işaretçi, kayan pencere, ikili arama, yığın.
    - slug: veri-yapilari
      title: Veri Yapıları
      description: Bağlı listeler, ağaçlar, heap ve graflar.
    - slug: ileri
      title: İleri Teknikler
      description: Dinamik programlama ve geri izleme.

- slug: sistem-tasarimi
  title: Sistem Tasarımı
  description: Ölçeklenebilir sistemleri tasarlamak ve bunu 45 dakikada anlatabilmek. Yapı taşları, ödünleşimler, uçtan uca çözülmüş klasik sorular ve kendi elinle kuracağın dağıtık sistem projeleri.
  icon: network
  accent: sky
  modules:
    - slug: temeller
      title: Temeller
      description: Mülakat çerçevesi, ölçekleme, kapasite tahmini, ağ ve API tasarımı.
    - slug: yapi-taslari
      title: Yapı Taşları
      description: Önbellek, kuyruklar, veritabanları, tutarlılık ve uzlaşma, dayanıklılık, arama ve konum, akış işleme ve tekrarlayan kalıplar.
    - slug: ornek-tasarimlar
      title: Örnek Tasarımlar
      description: Mülakatlarda en sık sorulan sorular, gereksinimden derinleşmeye kadar uçtan uca çözülmüş halde.
    - slug: projeler
      title: Uygulamalı Projeler ve Kaynaklar
      description: Okuyarak değil kurarak öğren. Yük testi, dağıtık hız sınırlama, outbox ve saga, kendi Redis'in, Raft ile kopyalanan anahtar–değer deposu ve seçilmiş kaynaklar.

- slug: csharp
  title: C#
  description: Tip sistemi, bellek yönetimi, LINQ, async/await ve eşzamanlılık. Dilin mülakatlarda sorulan derin konuları.
  icon: csharp
  accent: violet
  modules:
    - slug: temeller
      title: Tip Sistemi ve Bellek
      description: Değer ve referans tipleri, GC ve nesne ömrü.
    - slug: dil-ozellikleri
      title: Dil Özellikleri
      description: Generics, delegeler, LINQ ve async/await.
    - slug: ileri
      title: İleri Konular
      description: Eşzamanlılık, performans ve bellek, modern C#.

- slug: dotnet
  title: .NET ve ASP.NET Core
  description: İş ilanlarının omurgası. İstek hattı, Web API tasarımı, güvenlik, EF Core, önbellek, test, gözlemlenebilirlik, mimari, mesajlaşma ve LLM entegrasyonu.
  icon: server
  accent: indigo
  modules:
    - slug: aspnet-core
      title: ASP.NET Core
      description: Middleware, DI, Web API tasarımı, kimlik doğrulama ve güvenlik, arka plan işleri, gRPC ve SignalR.
    - slug: veri-ve-uretim
      title: Veri Erişimi ve Üretim
      description: EF Core derinlemesine, önbellekleme ve Redis, test, gözlemlenebilirlik ve dayanıklılık.
    - slug: mimari
      title: Mimari ve Mesajlaşma
      description: Clean Architecture, CQRS, DDD, modüler monolit ve mikroservisler, RabbitMQ, Kafka ve Azure Service Bus.
    - slug: yapay-zeka
      title: Yapay Zekâ ile Geliştirme
      description: .NET uygulamalarına LLM entegre etmek ve kodlama ajanlarıyla güvenli çalışmak.

- slug: kutuphane-api
  title: "Pratik Projesi: Kütüphane Yönetim API'si"
  description: Sıfırdan, faz faz kendi yazacağın bir .NET 10 Minimal API. Clean Architecture, iş kuralları, testler ve her fazın sonunda kod review'ı.
  icon: hammer
  accent: orange
  modules:
    - slug: hazirlik
      title: Hazırlık
      description: Rehberin kullanımı, geliştirme ortamı, proje tanımı, mimari ve paketler.
    - slug: fazlar
      title: Fazlar
      description: Çözüm iskeletinden entegrasyon testlerine ve bonus görevlere, adım adım uygulama.
    - slug: basvuru
      title: Başvuru
      description: Clean Code kontrol listesi, review süreci, sözlük ve kaynaklar.

- slug: javascript
  title: JavaScript
  description: Dilin gerçekte nasıl çalıştığı. Tipler, closure, prototipler, event loop ve asenkron programlama.
  icon: javascript
  accent: yellow
  modules:
    - slug: temeller
      title: Dilin Çekirdeği
      description: Tipler, kapsam, closure, this ve prototipler.
    - slug: asenkron
      title: Asenkron JavaScript
      description: Event loop, Promise ve async/await.

