# Tek köken (origin): SPA ve API aynı adresten sunulur. Böylece oturum çerezi SameSite=Strict kalır ve CORS gerekmez.

upstream zirve_api {
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 256k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/problem+json image/svg+xml;

    # Güvenlik başlıkları. İçerik politikası: yalnızca kendi kökenimizden betik; Monaco ve Mermaid
    # satır içi stil ürettiği için style-src 'unsafe-inline' gerekir; editör işçileri (worker) kendi kökenimizden yüklenir.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://zirve_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # TLS'i bu nginx'in önündeki bir yük dengeleyici sonlandırıyorsa onun gönderdiği şemayı koruyun.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Kod çalıştırma istekleri birkaç saniye sürebilir.
        proxy_read_timeout 90s;
    }

    # Dosya adında içerik özeti olan varlıklar hiç değişmez: bir yıl önbelleğe alınabilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: bilinmeyen yollar index.html'e düşer; index.html önbelleğe alınmaz ki yeni sürümler hemen görülsün.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
